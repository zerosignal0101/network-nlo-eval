[tool.poetry]
name = "network-nlo-eval"
version = "0.1.0"
description = "Network NLO Eval"
authors = ["Xiangrong Li <zerosignal0101@proton.me>"]
license = "GPL-3.0"
readme = "README.md"
homepage = "https://github.com/zerosignal0101/network-nlo-eval"
repository = "https://github.com/zerosignal0101/network-nlo-eval"
documentation = "https://network-nlo-eval.readthedocs.io"
classifiers = [
    "Development Status :: 3 - Alpha",
]

[tool.poetry.urls]
Changelog = "https://github.com/zerosignal0101/network-nlo-eval/releases"

[tool.poetry.dependencies]
python = ">=3.11,<=3.13"
click = ">=8.0.1"
numpy = "1.26.4"
scipy = "^1.17.1"
numba = "^0.64.0"
networkx = "^3.6.1"

[tool.poetry.group.dev.dependencies]
Pygments = ">=2.10.0"
black = ">=21.10b0"
coverage = {extras = ["toml"], version = ">=6.2"}
darglint = ">=1.8.1"
flake8 = ">=4.0.1"
flake8-bandit = ">=2.1.2"
flake8-bugbear = ">=21.9.2"
flake8-docstrings = ">=1.6.0"
flake8-rst-docstrings = ">=0.2.5"
furo = ">=2021.11.12"
isort = ">=5.10.1"
mypy = ">=0.930"
pep8-naming = ">=0.12.1"
pre-commit = ">=2.16.0"
pre-commit-hooks = ">=4.1.0"
pytest = ">=6.2.5"
pyupgrade = ">=2.29.1"
safety = ">=1.10.3"
sphinx = ">=6.0.1"
sphinx-autobuild = ">=2021.3.14"
sphinx-click = ">=3.0.2"
typeguard = ">=2.13.3"
xdoctest = {extras = ["colors"], version = ">=0.15.10"}
myst-parser = {version = ">=0.16.1"}
# 文档扩展依赖
numpydoc = "^1.10.0"
sphinx-gallery = "^0.20.0"
matplotlib = "^3.10.6"  # sphinx-gallery 画图需要

[tool.poetry.scripts]
network-nlo-eval = "network_nlo_eval.__main__:main"

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["network_nlo_eval", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.isort]
profile = "black"
force_single_line = true
lines_after_imports = 2

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
